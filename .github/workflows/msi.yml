name: Windows MSI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/phase3-managed-node-prerequisites
      - fix/phase3-audit-r1-remediation
      - fix/phase3-audit-r2-remediation

permissions:
  contents: read

jobs:
  package:
    name: Package and inspect MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache-dependency-path: services/node/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-14
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sidecar
      - run: pwsh -NoProfile -File scripts/inspect-yorva-msi.tests.ps1
      - run: pwsh -NoProfile -File scripts/package-yorva-msi.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorva-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/YORVA_*.msi
          if-no-files-found: error
