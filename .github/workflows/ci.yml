name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm api:lint
      - run: pnpm api:generate
      - run: git diff --exit-code -- apps/desktop/src/api/generated/schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  node:
    name: Go Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache-dependency-path: services/node/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: go build ./cmd/yorvad

  desktop-native:
    name: Windows Desktop native shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache-dependency-path: services/node/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-14
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sidecar
      - run: pwsh -NoProfile -File scripts/windows-lifecycle-smoke.ps1
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo fetch --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked --offline --lib
        working-directory: apps/desktop/src-tauri
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: "1"
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: pnpm --filter @yorva/desktop tauri build --no-bundle
