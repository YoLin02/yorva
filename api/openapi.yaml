        providerConnectionId: { type: string }
        displayName: { type: string }
        selectedModelIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string }
        defaultModelId: { type: string }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelProfileList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ModelProfile" }
    RuntimeModelDefaultPut:
      type: object
      additionalProperties: false
      required: [modelProfileId]
      properties:
        modelProfileId: { type: string, minLength: 1, maxLength: 64 }
    RuntimeModelDefault:
      type: object
      additionalProperties: false
      required: [modelProfileId, appliedRevision, updatedAt]
      properties:
        modelProfileId: { type: string }
        appliedRevision: { type: integer, minimum: 0 }
        updatedAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: "null" }
    InstanceModelBinding:
      type: object
      additionalProperties: false
      required: [instanceId, instanceName, modelProfileId, mode, appliedRevision, state, errorCode, updatedAt]
      properties:
        instanceId: { type: string }
        instanceName: { type: string }
        modelProfileId: { type: string }
        mode: { type: string, enum: [INHERIT, OVERRIDE, EXTERNAL_CONFIGURATION] }
        appliedRevision: { type: integer, minimum: 0 }
        state: { type: string, enum: [PENDING, SUCCEEDED, FAILED, SKIPPED] }
        errorCode: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
    InstanceModelBindingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InstanceModelBinding" }
    ModelProfileApplicationRequest:
      type: object
      additionalProperties: false
      required: [modelProfileId, instanceIds, mode]
      properties:
        modelProfileId: { type: string, minLength: 1, maxLength: 64 }
        instanceIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        mode: { type: string, enum: [INHERIT, OVERRIDE] }
    ModelConfigurationPatch:
      type: object
      additionalProperties: false
      required: [providerPresetId, modelId, selectedModelIds]
      properties:
        providerPresetId:
          type: string
          minLength: 1
          maxLength: 64
        modelId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$"
        selectedModelIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$"
    ModelCredentialPut:
      type: object
      additionalProperties: false
      required: [providerPresetId, modelId, selectedModelIds, value]
      properties:
        providerPresetId:
          type: string
          minLength: 1
          maxLength: 64
        modelId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$"
        selectedModelIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$"
        value:
          type: string
          minLength: 4
          maxLength: 16384
          writeOnly: true
    ModelCredential:
      type: object
      additionalProperties: false
      required: [providerPresetId, configured, observedAt]
      properties:
        providerPresetId:
          type: string
        configured:
          type: boolean
        observedAt:
          type: string
          format: date-time
    ModelProviderCatalogRequest:
      type: object
      additionalProperties: false
      required: [providerPresetId, value]
      properties:
        providerPresetId:
          type: string
          minLength: 1
          maxLength: 64
        value:
          type: string
          minLength: 4
          maxLength: 16384
          writeOnly: true
    ModelProviderCatalog:
      type: object
      additionalProperties: false
      required: [providerPresetId, items, fetchedAt]
      properties:
        providerPresetId:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
        fetchedAt:
          type: string
          format: date-time
    ModelValidationSummary:
      type: object
      additionalProperties: false
      required: [state, errorCode, completedAt]
      properties:
        state:
          type: string
          enum: [NOT_RUN, PASSED, FAILED, UNKNOWN]
        errorCode:
          type: ["string", "null"]
        completedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    ModelValidationRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    ModelConfiguration:
      type: object
      additionalProperties: false
      required: [providerPresetId, modelId, selectedModelIds, state, credentialConfigured, observedAt, validation]
      properties:
        providerPresetId:
          type: string
        modelId:
          type: string
        selectedModelIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        state:
          type: string
          enum: [UNCONFIGURED, CONFIGURED]
        credentialConfigured:
          type: boolean
        observedAt:
          type: string
          format: date-time
        validation:
          $ref: "#/components/schemas/ModelValidationSummary"
    RuntimeDiscoveryErrorCode:
      type: [string, "null"]
      enum:
        - null
        - RUNTIME_NOT_INSTALLED
        - RUNTIME_UNSUPPORTED
        - RUNTIME_EXECUTABLE_BROKEN
        - RUNTIME_VERSION_MALFORMED
        - RUNTIME_DISCOVERY_TIMEOUT
        - RUNTIME_COMMAND_OUTPUT_LIMIT
        - RUNTIME_DISCOVERY_AMBIGUOUS
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
