        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  responses:
    Unauthorized:
      description: The local session credential is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request Origin is not an approved Desktop origin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested local API resource does not exist. Unmatched routes use this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The resource does not support the request method.
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreflightAccepted:
      description: The known endpoint accepts the approved Desktop origin and requested headers.
    InternalError:
      description: Runtime discovery failed unexpectedly without exposing internal command output.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request was syntactically or semantically invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current Operation or installation state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Authoritative Runtime management state could not be safely queried or changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    RuntimeId:
      name: runtimeId
      in: path
      required: true
      schema:
        type: string
        enum: [hermes]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[\\x21-\\x7E]+$"
    ChannelSessionId:
      name: Yorva-Session-Id
      in: header
      required: true
      description: Ephemeral Desktop process identifier; it is not an authentication credential.
      schema:
        type: string
        minLength: 20
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    ChannelType:
      name: channelType
      in: path
      required: true
      schema:
        type: string
        enum: [weixin, wecom]
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^(?!\\.$|\\.\\.$)[A-Za-z0-9._-]{1,128}$"
    MCPPresetId:
      name: presetId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^(?!\\.$|\\.\\.$)[A-Za-z0-9._-]{1,128}$"
    MCPServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^(?!\\.$|\\.\\.$)[A-Za-z0-9._-]{1,128}$"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, protocolVersion]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: yorvad
        version:
          type: string
        protocolVersion:
          type: string
    Node:
      type: object
      additionalProperties: false
      required: [id, name, hostname, platform, architecture, nodeVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        platform:
          type: string
        architecture:
          type: string
        nodeVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RuntimeDiscovery:
      type: object
