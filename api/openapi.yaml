openapi: 3.1.0
info:
  title: YORVA Local Node API
  version: 0.0.0
  description: Phase 1 loopback contract between YORVA Desktop and yorvad.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "49152"
        description: Ephemeral loopback port returned by the bootstrap handshake.
tags:
  - name: Bootstrap
    description: Daemon bootstrap, liveness, and session event transport.
  - name: Node
    description: Persisted local Node identity.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read minimal daemon liveness
      tags: [Bootstrap]
      security: []
      responses:
        "200":
          description: The daemon is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsHealth
      summary: Validate CORS access for the health endpoint
      tags: [Bootstrap]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/node:
    get:
      operationId: getNode
      summary: Read the persisted local Node identity
      tags: [Node]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The local Node identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsNode
      summary: Validate CORS access for the Node endpoint
      tags: [Node]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Connect to the authenticated local event stream
      tags: [Bootstrap]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: An SSE stream. Phase 1 may contain keepalive comments only.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsEvents
      summary: Validate CORS access for the event stream endpoint
      tags: [Bootstrap]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  responses:
    Unauthorized:
      description: The local session credential is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The request Origin is not an approved Desktop origin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested local API resource does not exist. Unmatched routes use this response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: The resource does not support the request method.
      headers:
        Allow:
          schema:
            type: string
            const: GET, OPTIONS
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreflightAccepted:
      description: The known endpoint accepts the approved Desktop origin and requested headers.
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, protocolVersion]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: yorvad
        version:
          type: string
        protocolVersion:
          type: string
    Node:
      type: object
      additionalProperties: false
      required: [id, name, hostname, platform, architecture, nodeVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        platform:
          type: string
        architecture:
          type: string
        nodeVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, ORIGIN_NOT_ALLOWED, NOT_FOUND, METHOD_NOT_ALLOWED, INTERNAL_ERROR]
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
