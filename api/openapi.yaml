openapi: 3.1.0
info:
  title: YORVA Local Node API
  version: 0.0.0
  description: Local loopback contract between YORVA Desktop and yorvad, including the fixed sanitized Phase 8 diagnostic export.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "49152"
        description: Ephemeral loopback port returned by the bootstrap handshake.
tags:
  - name: Bootstrap
    description: Daemon bootstrap, liveness, and session event transport.
  - name: Node
    description: Persisted local Node identity.
  - name: Runtimes
    description: Runtime discovery, compatibility, and Hermes installation Operations.
  - name: Instances
    description: Hermes Profile inventory as normalized YORVA Instances.
  - name: Diagnostics
    description: Safe normalized Instance health and bounded redacted log snapshots.
  - name: Models
    description: Safe model Provider presets, configuration, credentials, and explicit validation.
  - name: Channels
    description: Instance-scoped Weixin and WeCom connection state and Operations.
  - name: Skills
    description: Safe authoritative Instance Skill inventory and inspection.
  - name: MCP
    description: Safe authoritative configured MCP and reviewed preset inventory.
  - name: Backups
    description: Encrypted Runtime backups stored in YORVA's protected system application-data directory, with safe index, Restore, and deletion Operations.
  - name: Upgrades
    description: Read-only managed Runtime upgrade planning; mutation remains capability-gated and unregistered.
  - name: Settings
    description: Non-secret local management settings.
  - name: Operations
    description: Durable local management Operations.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read minimal daemon liveness
      tags: [Bootstrap]
      security: []
      responses:
        "200":
          description: The daemon is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsHealth
      summary: Validate CORS access for the health endpoint
      tags: [Bootstrap]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/node:
    get:
      operationId: getNode
      summary: Read the persisted local Node identity
      tags: [Node]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The local Node identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsNode
      summary: Validate CORS access for the Node endpoint
      tags: [Node]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/diagnostics/bundle:
    post:
      operationId: exportDiagnosticBundle
      summary: Build the fixed sanitized local diagnostic bundle
      description: Returns a bounded ZIP assembled only from fixed safe projections. It never includes secret plaintext, raw databases, arbitrary environment data, or arbitrary files.
      tags: [Diagnostics]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A complete sanitized diagnostic ZIP ready for the capability-scoped native Save As flow.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentEncoding: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Diagnostic export is not available in this daemon build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    options:
      operationId: optionsDiagnosticBundle
      summary: Validate CORS access for diagnostic export
      tags: [Diagnostics]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Connect to the authenticated local event stream
      tags: [Bootstrap]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: An SSE stream of redacted notifications, including operation.started, operation.progress, operation.completed, operation.failed and operation.cancelled. Resource GET remains the source of truth.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsEvents
      summary: Validate CORS access for the event stream endpoint
      tags: [Bootstrap]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runtimes/{runtimeKind}/detect:
    parameters:
      - name: runtimeKind
        in: path
        required: true
        schema:
          type: string
          enum: [hermes]
    post:
      operationId: detectRuntime
      summary: Discover a registered Runtime installation
      description: Performs a bounded, read-only discovery. Negative discovery outcomes are returned as typed 200 responses.
      tags: [Runtimes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The completed Runtime discovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDiscovery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
    options:
      operationId: optionsRuntimeDetection
      summary: Validate CORS access for Runtime discovery
      tags: [Runtimes]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runtimes/{runtimeId}/upgrade-plan:
    parameters:
      - name: runtimeId
        in: path
        required: true
        schema:
          type: string
          enum: [hermes]
    get:
      operationId: getRuntimeUpgradePlan
      summary: Read the exact managed Runtime upgrade plan
      description: Returns a safe projection derived from the live active pointer, matching sealed generation, and the compiled packaged candidate. It never authorizes or starts Upgrade or Rollback mutation.
      tags: [Upgrades]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current read-only upgrade plan, including explicit unknown or blocked evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementUpgradePlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    options:
      operationId: optionsRuntimeUpgradePlan
      summary: Validate CORS access for the read-only Runtime upgrade plan
      tags: [Upgrades]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runtimes/{runtimeId}/upgrade:
    parameters:
      - name: runtimeId
        in: path
        required: true
        schema: { type: string, enum: [hermes] }
    post:
      operationId: upgradeManagedRuntime
      summary: Start an eligible packaged-generation Runtime upgrade
      tags: [Upgrades]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClosedEmptyObject" } } }
      responses:
        "202": { description: Runtime upgrade accepted., content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/runtimes/{runtimeId}/rollback:
    parameters:
      - name: runtimeId
        in: path
        required: true
        schema: { type: string, enum: [hermes] }
    post:
      operationId: rollbackManagedRuntime
      summary: Start an eligible exact-generation Runtime rollback
      tags: [Upgrades]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClosedEmptyObject" } } }
      responses:
        "202": { description: Runtime rollback accepted., content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/runtimes/{runtimeId}/backups:
    parameters:
      - name: runtimeId
        in: path
        required: true
        schema:
          type: string
          enum: [hermes]
    get:
      operationId: listRuntimeBackups
      summary: List last-observed Runtime backup index entries
      description: Reads only the safe YORVA index. It does not access, decrypt, hash, or mutate an artifact; AVAILABLE and verifiedAt describe the last successful controlled verification, not current Restore eligibility.
      tags: [Backups]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Safe Runtime-scoped backup index snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementBackupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRuntimeBackup
      summary: Start an encrypted Runtime backup Operation
      description: Uses YORVA's fixed protected system application-data backup directory. No local path, destination capability, encryption key, passphrase, credential, or archive content enters this API.
      tags: [Backups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupCreateRequest"
      responses:
        "202":
          description: The backup Operation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    options:
      operationId: optionsRuntimeBackups
      summary: Validate CORS access for Runtime backup inventory
      tags: [Backups]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runtimes/{runtimeId}/backups/{backupId}:
    parameters:
      - name: runtimeId
        in: path
        required: true
        schema:
          type: string
          enum: [hermes]
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: getRuntimeBackup
      summary: Read one last-observed Runtime backup index entry
      description: Returns no artifact path, destination reference, decryption key reference, passphrase, credential, or archive-member detail. The request performs no live artifact verification.
      tags: [Backups]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Safe Runtime-scoped backup index entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    options:
      operationId: optionsRuntimeBackup
      summary: Validate CORS access for one Runtime backup index entry
      tags: [Backups]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/{backupId}:
    parameters:
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      operationId: deleteRuntimeBackup
      summary: Start deletion of one indexed encrypted backup
      tags: [Backups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosedEmptyObject"
      responses:
        "202":
          description: The delete Operation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    options:
      operationId: optionsRuntimeBackupDelete
      summary: Validate CORS access for backup deletion
      tags: [Backups]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/backups/{backupId}/restore:
    parameters:
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    post:
      operationId: restoreRuntimeBackup
      summary: Start a transactional restore of one verified indexed backup
      description: Re-verifies the indexed encrypted artifact, requires the Runtime to be stopped, stages the restored tree, and rolls back the filesystem switch if post-check fails.
      tags: [Backups]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosedEmptyObject"
      responses:
        "202":
          description: The Restore Operation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    options:
      operationId: optionsRuntimeBackupRestore
      summary: Validate CORS access for backup Restore
      tags: [Backups]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runtimes/hermes/install:
    post:
      operationId: startHermesInstall
      summary: Start a Hermes installation Operation
      tags: [Runtimes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeInstallRequest"
      responses:
        "202":
          description: The installation Operation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsHermesInstall
      summary: Validate CORS access for Hermes installation
      tags: [Runtimes]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/runtimes/hermes/prerequisites:
    get:
      operationId: getHermesPrerequisites
      summary: Read Hermes Node.js prerequisite health
      tags: [Runtimes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Typed Node/npm/dependency health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesPrerequisites"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    options:
      operationId: optionsHermesPrerequisites
      summary: Validate CORS access for Hermes prerequisites
      tags: [Runtimes]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/runtimes/hermes/prerequisites/install:
    post:
      operationId: startHermesPrerequisites
      summary: Start a Hermes Node prerequisite Operation
      tags: [Runtimes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeInstallRequest"
      responses:
        "202":
          description: The prerequisite Operation was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    options:
      operationId: optionsHermesPrerequisitesInstall
      summary: Validate CORS access for Hermes prerequisite installation
      tags: [Runtimes]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/settings/hermes/download-sources:
    get:
      operationId: getHermesDownloadSources
      summary: Read the effective Hermes artifact and dependency sources
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The complete effective source configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesDownloadSources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putHermesDownloadSources
      summary: Replace the Hermes artifact and dependency sources
      tags: [Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HermesDownloadSources"
      responses:
        "200":
          description: The validated saved source configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesDownloadSources"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: resetHermesDownloadSources
      summary: Restore the compiled mainland China source defaults
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The restored default source configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesDownloadSources"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    options:
      operationId: optionsHermesDownloadSources
      summary: Validate CORS access for Hermes download source settings
      tags: [Settings]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/operations:
    get:
      operationId: listOperations
      summary: List recent Operations for Desktop recovery
      tags: [Operations]
      security:
        - bearerAuth: []
      parameters:
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: A bounded Operation list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    options:
      operationId: optionsOperations
      summary: Validate CORS access for Operation listing
      tags: [Operations]
      security: []
      responses:
        "204":
          $ref: "#/components/responses/PreflightAccepted"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOperation
      summary: Read one Operation
      tags: [Operations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The Operation resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
