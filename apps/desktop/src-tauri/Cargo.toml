[package]
name = "yorva-desktop"
version = "0.3.0"
description = "YORVA local-first desktop shell"
authors = ["yolin"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "yorva_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
